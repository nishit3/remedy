[project]
name = "remedy"
version = "0.1.0"
description = "Remedy - a self-verifying coding agent that resolves GitHub issues"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "typer>=0.12.0",
]

[project.scripts]
remedy = "remedy.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["remedy*"]
